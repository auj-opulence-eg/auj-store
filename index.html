    <style>
        :root {
            --emerald-deep: #103828;
            --botanical-green: #587256;
            --mint-soft: #DCE6DC;
            --ivory-paper: #F5F2EB;
            --white: #FFFFFF;
            --taupe: #B0927D;
            --text-dark: #1E2420;
            --text-muted: #626B65;
            --border-line: #D5DBD5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--ivory-paper);
            color: var(--text-dark);
            line-height: 1.7;
            padding-bottom: 85px;
        }

        /* شريط الإدارة السري */
        #admin-bar {
            display: none;
            background-color: var(--emerald-deep);
            color: var(--ivory-paper);
            padding: 12px 4%;
            position: sticky;
            top: 0;
            z-index: 999;
            border-bottom: 2px solid var(--taupe);
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .admin-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .admin-btn {
            background: var(--botanical-green); color: white; border: none;
            padding: 6px 12px; border-radius: 6px; font-size: 11.5px; font-weight: 700; cursor: pointer;
        }
        .admin-btn.planner { background: var(--taupe); color: #1E2420; }
        .admin-btn.publish { background: #27ae60; }
        .admin-btn.exit { background: #c0392b; }

        /* الهيدر */
        header {
            background-color: var(--emerald-deep);
            color: var(--ivory-paper);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-title { font-family: 'Amiri', serif; font-size: 28px; font-weight: 700; letter-spacing: 1px; line-height: 1; }
        .logo-sub { font-size: 10px; color: var(--mint-soft); display: block; margin-top: 2px; }

        .header-btns { display: flex; gap: 8px; align-items: center; }
        .order-form-trigger {
            background-color: var(--ivory-paper);
            color: var(--emerald-deep);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 12.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* البانر الافتتاحي */
        .hero {
            background: linear-gradient(180deg, var(--emerald-deep) 0%, #194A36 100%);
            color: var(--ivory-paper);
            padding: 50px 6% 65px;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
        }

        .hero-tag {
            display: inline-block;
            border: 1px solid rgba(220, 230, 220, 0.35);
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 11px;
            color: var(--mint-soft);
            margin-bottom: 14px;
        }

        .hero h1 { font-family: 'Amiri', serif; font-size: 34px; margin-bottom: 12px; line-height: 1.35; }
        .hero p { font-size: 14px; color: var(--mint-soft); max-width: 560px; margin: 0 auto 24px; }

        .hero-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .btn-ivory {
            background: var(--ivory-paper); color: var(--emerald-deep); border: none;
            padding: 11px 24px; border-radius: 10px; font-weight: 700; font-size: 13.5px; cursor: pointer; text-decoration: none;
        }
        .btn-glass {
            background: rgba(255,255,255,0.12); color: var(--ivory-paper); border: 1px solid rgba(255,255,255,0.3);
            padding: 11px 22px; border-radius: 10px; font-weight: 600; font-size: 13.5px; cursor: pointer;
        }

        /* بطاقات النماذج السريعة */
        .forms-bar {
            max-width: 950px;
            margin: -32px auto 35px;
            padding: 0 18px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
            gap: 12px;
        }

        .form-shortcut {
            background: var(--white);
            border: 1px solid var(--border-line);
            border-radius: 14px;
            padding: 16px 12px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(16, 56, 40, 0.06);
            transition: 0.2s;
        }

        .form-shortcut:hover { transform: translateY(-3px); border-color: var(--botanical-green); }
        .form-shortcut span { font-size: 22px; display: block; margin-bottom: 4px; }
        .form-shortcut strong { font-size: 13px; color: var(--emerald-deep); display: block; }
        .form-shortcut small { font-size: 11px; color: var(--text-muted); }

        /* قسم قصة الدار */
        .story-paper {
            max-width: 920px;
            margin: 30px auto;
            padding: 35px 25px;
            background: var(--white);
            border: 1px solid var(--border-line);
            border-top: 5px solid var(--botanical-green);
            border-radius: 14px;
            text-align: center;
        }
        .story-paper h2 { font-family: 'Amiri', serif; font-size: 28px; color: var(--emerald-deep); margin-bottom: 12px; }
        .story-paper p { font-size: 14px; color: var(--text-dark); max-width: 680px; margin: 0 auto 10px; }

        /* قسم التركيبات */
        .container { max-width: 1050px; margin: 35px auto; padding: 0 18px; }
        .section-header { text-align: center; margin-bottom: 22px; }
        .section-header h2 { font-family: 'Amiri', serif; font-size: 28px; color: var(--emerald-deep); }

        .filter-tabs { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 25px; }
        .filter-btn {
            background: var(--white); border: 1px solid var(--border-line); color: var(--text-dark);
            padding: 7px 16px; border-radius: 8px; cursor: pointer; font-size: 12.5px; font-weight: 700;
        }
        .filter-btn.active { background: var(--botanical-green); color: var(--white); border-color: var(--botanical-green); }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .product-card {
            background: var(--white); border: 1px solid var(--border-line); border-radius: 14px;
            overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; position: relative;
        }
        .card-header-strip {
            background: var(--mint-soft); color: var(--emerald-deep); padding: 5px 14px;
            font-size: 11px; font-weight: 700; display: flex; justify-content: space-between;
        }
        .card-admin-controls { display: none; padding: 6px 14px; background: #eee; gap: 6px; }
        .card-admin-controls button { border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; color: white; cursor: pointer; }
        .edit-prod-btn { background: #2980b9; }
        .del-prod-btn { background: #c0392b; }

        .product-img { width: 100%; height: 190px; object-fit: cover; }
        .product-body { padding: 18px; text-align: center; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .product-sub { font-size: 11.5px; color: var(--botanical-green); font-weight: 700; margin-bottom: 4px; }
        .product-title { font-size: 17.5px; font-weight: 700; color: var(--emerald-deep); margin-bottom: 8px; }
        .product-desc { font-size: 12.5px; color: var(--text-muted); margin-bottom: 16px; }
        .add-btn {
            width: 100%; background: var(--ivory-paper); color: var(--emerald-deep);
            border: 1.5px solid var(--emerald-deep); padding: 9px; border-radius: 8px;
            font-weight: 700; cursor: pointer; font-size: 13px; transition: 0.2s;
        }
        .add-btn:hover { background: var(--emerald-deep); color: var(--white); }
